# troll_chieftain.yaml
# Simple 2-phase boss - gets angry when hurt, no fancy mechanics
name: troll_chieftain
on_death_script: boss_death
enrage_enabled: false

phases:
  - name: "Phase 1 - Normal"
    enter_trigger:
      type: hp_below
      threshold: 1.0
    behavior_tree: aggressive_melee
    damage_multiplier: 1.0
    speed_multiplier: 1.0

  - name: "Phase 2 - Frenzy"
    enter_trigger:
      type: hp_below
      threshold: 0.4
    behavior_tree: boss_berserk
    damage_multiplier: 1.8
    speed_multiplier: 1.4
    defense_multiplier: 0.7
    aggro_range: 15
