# YAML field names are historical misnomers from the legacy CFG→YAML conversion.
# The positional mapping to legacy CItem fields is:
#
#   YAML field     → Legacy field              Notes
#   ─────────────────────────────────────────────────────────────────────────
#   id             → m_sIDnum
#   name           → m_cName
#   type           → m_cItemType
#   equip_pos      → m_cEquipPos
#   color_r1       → m_sItemEffectType         Consumable effect type
#   color_g1       → m_sItemEffectValue1       Consumable effect values
#   color_b1       → m_sItemEffectValue2
#   color_r2       → m_sItemEffectValue3
#   color_g2       → m_sItemEffectValue4
#   color_b2       → m_sItemEffectValue5
#   weight         → m_sItemEffectValue6
#   durability     → m_wMaxLifeSpan
#   equip_type     → m_sSpecialEffect
#   sprite_id      → m_sSprite                 Ground item sprite category (1=swords, 3=shields, 6=misc, 15=axes)
#   price          → m_sSpriteFrame            Ground item sprite frame within category
#   attack_range   → m_wPrice                  Negative = not for sale (abs value used)
#   skill_type     → m_wWeight
#   attack_bonus   → m_cApprValue              Equipment appearance value
#   hit_prob       → m_cSpeed
#   dodge_prob     → m_sLevelLimit
#   defense        → m_cGenderLimit
#   level_limit    → m_sSpecialEffectValue1
#   is_two_handed  → m_sSpecialEffectValue2
#   unk1           → m_sRelatedSkill
#   effect1        → m_cCategory
#   effect2        → m_cItemColor
#
