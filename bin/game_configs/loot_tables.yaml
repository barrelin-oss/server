# loot_tables.yaml
# NPC loot configuration - all drop pools and per-NPC loot configs
#
# Pools: Named collections of weighted items. Higher weight = more likely.
# Loot: Per-sprite_id config with on_kill and on_despawn phases.
#   - chance: per 10000 (e.g., 2100 = 21%)
#   - gold_chance: per 10000, gold amount comes from NPC template
#   - multi_drop: boss corpse despawn drops N iterations of the pool rolls
#
# Legacy effective rates (from nested dice):
#   Gold: 35% * 60% = 21% -> gold_chance: 2100
#   Standard item: 35% * 40% * 90% = 12.6% -> chance: 1260
#   Melee weapon: 35% * 40% * 10% * 60% * 80% = 0.672% -> chance: 67
#   Wand: 35% * 40% * 10% * 60% * 20% = 0.168% -> chance: 17
#   Armor: 35% * 40% * 10% * 40% = 0.56% -> chance: 56

