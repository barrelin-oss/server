# npc_type: 10 = Slime, 14 = Orc, 16 = Giant-Ant, 15 = ShopKeeper-W, 19 = Gandlf

name: "Elvine"

initial_points:
  - { id: 0, x: 60, y: 200 }
  - { id: 1, x: 55, y: 205 }
  - { id: 2, x: 65, y: 205 }

