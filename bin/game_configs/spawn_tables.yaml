# Helbreath Spawn Tables
# Data-driven composable NPC spawn rules

# =============================================================================
# Random Spawnable NPCs Whitelist
# =============================================================================
# Only NPCs listed here can be randomly spawned by the mob generator.
# NPCs not in this list will be filtered out from spawn tables.
#
# Fields:
#   name: NPC name (must match npc_templates.yaml)
#   template_id: NPC template ID (0 = not spawnable, used for future NPCs)
#   special_attack_prob: Chance of using special attack (0-100)
#   special_attack_kind: Type of special attack:
#     - melee (1): Physical melee special
#     - ranged (2): Ranged attack
#     - poison (3): Poison effect
#     - stun (4): Stunning attack
#     - magic (5): Magic-based special
#     - area (6): Area of effect
#     - buff (7): Self-buff ability
#     - summon (8): Summons minions
#   enabled: Set to false to temporarily disable (default: true)
#
# Based on legacy CGame::MobGenerator() switch statement
# =============================================================================

