# =============================================================================
# Spawn Tables
# =============================================================================

spawn_tables:
  # Level 1: arefarm, elvfarm, aresden, elvine (starter areas)
  # Probabilities: Rabbit 45%, Slime 19%, Giant-Ant 20%, Cat 10%, Orc 6%
  - name: "level_1_classic"
    type: level
    level: 1
    npcs:
      - { name: "Rabbit", weight: 45 }
      - { name: "Slime", weight: 19 }
      - { name: "Giant-Ant", weight: 20 }
      - { name: "Cat", weight: 10 }
      - { name: "Orc", weight: 6 }

  # Level 2: Basic dungeons
  # Probabilities: Slime 40%, Giant-Ant 40%, Amphis 20%
  - name: "level_2_classic"
    type: level
    level: 2
    npcs:
      - { name: "Slime", weight: 40 }
      - { name: "Giant-Ant", weight: 40 }
      - { name: "Amphis", weight: 20 }

  # Level 3: Mid-level areas
  - name: "level_3_classic"
    type: level
    level: 3
    npcs:
      - { name: "Orc", weight: 10 }
      - { name: "Zombie", weight: 10 }
      - { name: "Rudolph", weight: 5 }
      - { name: "Skeleton", weight: 8 }
      - { name: "Orc-Mage", weight: 8 }
      - { name: "Scorpion", weight: 9 }
      - { name: "Stone-Golem", weight: 7 }
      - { name: "Clay-Golem", weight: 4 }
      - { name: "Troll", weight: 4 }
      - { name: "WereWolf", weight: 4 }
      - { name: "Giant-Frog", weight: 4 }
      - { name: "Ettin", weight: 4 }
      - { name: "Cyclops", weight: 10 }
      - { name: "Orge", weight: 5 }
      - { name: "Hellbound", weight: 5 }
      - { name: "Mountain-Giant", weight: 5 }

  # Level 4: Dungeons
  - name: "level_4_classic"
    type: level
    level: 4
    npcs:
      - { name: "Giant-Ant", weight: 25 }
      - { name: "Amphis", weight: 25 }
      - { name: "Stone-Golem", weight: 15 }
      - { name: "Clay-Golem", weight: 15 }
      - { name: "Hellbound", weight: 10 }
      - { name: "Beholder", weight: 10 }

  # Level 5: Advanced dungeons
  - name: "level_5_classic"
    type: level
    level: 5
    npcs:
      - { name: "Zombie", weight: 10 }
      - { name: "Orc", weight: 10 }
      - { name: "Giant-Ant", weight: 15 }
      - { name: "Skeleton", weight: 20 }
      - { name: "Stone-Golem", weight: 20 }
      - { name: "Hellbound", weight: 10 }
      - { name: "Beholder", weight: 5 }
      - { name: "Dark-Elf", weight: 10 }

  # Level 6: High-level areas
  - name: "level_6_classic"
    type: level
    level: 6
    npcs:
      - { name: "Orc", weight: 10 }
      - { name: "Zombie", weight: 10 }
      - { name: "Skeleton", weight: 15 }
      - { name: "Clay-Golem", weight: 15 }
      - { name: "Beholder", weight: 10 }
      - { name: "Dark-Elf", weight: 10 }
      - { name: "Hellbound", weight: 15 }
      - { name: "Demon", weight: 10 }
      - { name: "Liche", weight: 5 }

  # Level 7: Expert areas
  - name: "level_7_classic"
    type: level
    level: 7
    npcs:
      - { name: "Skeleton", weight: 15 }
      - { name: "Clay-Golem", weight: 10 }
      - { name: "Beholder", weight: 10 }
      - { name: "Dark-Elf", weight: 15 }
      - { name: "Demon", weight: 20 }
      - { name: "Liche", weight: 15 }
      - { name: "Unicorn", weight: 10 }
      - { name: "WyvernM", weight: 5 }

