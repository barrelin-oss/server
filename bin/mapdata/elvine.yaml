  - { id: 4, type: 0, x1: 56, y1: 196, x2: 56, y2: 196, npc_type: 15, max_count: 1 }
  - { id: 5, type: 0, x1: 64, y1: 196, x2: 64, y2: 196, npc_type: 19, max_count: 1 }
