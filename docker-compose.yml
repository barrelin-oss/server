services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: helbreath
      POSTGRES_USER: hgserver
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helbreath_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hgserver -d helbreath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
