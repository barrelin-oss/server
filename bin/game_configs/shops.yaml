# shops.yaml
# NPC shop configurations
# buy_categories: item_category values the shop will purchase from players
# repair_categories: item_category values the shop can repair
# items: items for sale (item_id references items.yaml)
#
# Item categories - values as they actually appear in items.yaml (legacy numbering).
# The previous legend here described a planned scheme that no item ever used, so every
# buy_categories list below was matching against numbers that did not exist.
#   0=general (gems, fruit)   1=melee weapons   3=bows        4=arrows
#   5=shields                 6=body armor      8=magic wands
#   11=clothing/leggings      12=capes/shoes    13=robes      15=costumes
#   21=potions                31=food           43=fishing rod
#   46=accessories (rings, necklaces)
#   42=tickets AND Gold itself - never make this buyable/sellable.

shops:
  # General shopkeepers - buy/sell potions, food, scrolls, misc
  ShopKeeper-W:
    type: general
    buy_categories: [0, 11, 12, 13, 15, 21, 31, 46]
    repair_categories: [11, 12, 13, 15]
    items:
      - { item_id: 91, count: 1 }    # RedPotion (HP)
      - { item_id: 93, count: 1 }    # BluePotion (MP)
      - { item_id: 95, count: 1 }    # GreenPotion (SP)
      - { item_id: 99, count: 1 }    # Meat (comida: repoe fome + hp_stock)
    # Magias ensinaveis. Requisito (int_req/mag_req) e preco (cost) vem do magic.yaml.
    # 0=Magic-Missile 1=Heal 2=Create-Food 32=Invisibility 33=Protection-From-Magic
    spells: [0, 1, 2, 32, 33]

  ShopKeeper-E:
    type: general
    buy_categories: [0, 11, 12, 13, 15, 21, 31, 46]
    repair_categories: [11, 12, 13, 15]
    items:
      - { item_id: 91, count: 1 }    # RedPotion (HP)
      - { item_id: 93, count: 1 }    # BluePotion (MP)
      - { item_id: 95, count: 1 }    # GreenPotion (SP)
      - { item_id: 99, count: 1 }    # Meat (comida: repoe fome + hp_stock)
    # Magias ensinaveis. Requisito (int_req/mag_req) e preco (cost) vem do magic.yaml.
    # 0=Magic-Missile 1=Heal 2=Create-Food 32=Invisibility 33=Protection-From-Magic
    spells: [0, 1, 2, 32, 33]

  # Blacksmiths - buy/sell/repair weapons and armor
  Gandlf:
    type: blacksmith
    buy_categories: [1, 3, 4, 5, 6, 8, 11, 12, 13, 15, 43]
    repair_categories: [1, 3, 5, 6, 8, 11, 12, 13, 15, 43]
    items:
      - { item_id: 1 }    # Dagger
      - { item_id: 8 }    # ShortSword
      - { item_id: 12 }   # MainGauche

  William:
    type: blacksmith
    buy_categories: [1, 3, 4, 5, 6, 8, 11, 12, 13, 15, 43]
    repair_categories: [1, 3, 5, 6, 8, 11, 12, 13, 15, 43]
    items:
      - { item_id: 1 }    # Dagger
      - { item_id: 8 }    # ShortSword
      - { item_id: 12 }   # MainGauche
