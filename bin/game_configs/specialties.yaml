# specialties.yaml - monster mastery, from the Helbreath Olympia client (contents/specialties.json).
# npc_type is the NPC sprite type. Level L of a specialty needs base_kills * L * (L + 1) / 2 kills of that
# monster (our reading of Olympia's "base kills scaling"); each level unlocks the next bonus of the ladder
# against that monster. Bonus steps (ours): damage +2, damage_pct +3%, damage_reduction +1%,
# damage_reduction_pct +3%, hit_ratio +5, hit_ratio_pct +3%, drop_rate +5%. Percentages multiply.
specialties:
